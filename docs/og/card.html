<!doctype html>
<!--
  Source of public/og.jpg, the 1200×630 link preview. Re-render after any change:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --mute-audio \
    --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 \
    --screenshot=og.png "file://$PWD/docs/og/card.html"
  magick og.png -strip -sampling-factor 4:2:0 -quality 84 -interlace JPEG public/og.jpg

  WhatsApp drops heavy previews: keep og.jpg under ~300 KB.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap"
    />
    <style>
      :root {
        --ivory: #faf0de;
        --cream: #f3e4c8;
        --gold: #c69951;
        --gold-deep: #8a6328;
        --rose-taupe: #8c5a5e;
        --ink: #4a3a33;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        position: relative;
        background: radial-gradient(ellipse at 50% 45%, var(--ivory) 55%, var(--cream));
        color: var(--ink);
        font-family: 'Cormorant Garamond', serif;
      }

      /* Fades into the paper on the left and bottom, as the key still bleeds into ivory. */
      .couple {
        position: absolute;
        right: 0;
        top: 0;
        width: 560px;
        height: 630px;
        background: url('../art-direction/couple-key.png') 50% 6% / 600px auto no-repeat;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 26%), linear-gradient(0deg, transparent 0, #000 22%);
        -webkit-mask-composite: source-in;
      }

      .text {
        position: absolute;
        left: 76px;
        top: 0;
        width: 640px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }

      .kicker {
        font-family: 'Cinzel', serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold-deep);
      }

      .names {
        margin: 4px 0 2px -6px;
        font-family: 'Great Vibes', cursive;
        font-size: 128px;
        font-weight: 400;
        line-height: 0.95;
        color: var(--rose-taupe);
      }

      .amp {
        margin: 0 8px;
        font-size: 96px;
        color: var(--gold);
      }

      .rule {
        width: 460px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .events {
        display: grid;
        gap: 12px;
        list-style: none;
        font-family: 'Cinzel', serif;
        font-size: 27px;
        letter-spacing: 0.12em;
      }

      .events li { display: flex; align-items: baseline; gap: 18px; }

      .events .ev { width: 210px; font-weight: 500; color: var(--rose-taupe); }

      .venue { font-size: 28px; font-style: italic; }
    </style>
  </head>
  <body>
    <div class="couple"></div>
    <div class="text">
      <p class="kicker">Wedding Invitation</p>
      <h1 class="names">Vikram <span class="amp">&amp;</span><br />Vaishnavi</h1>
      <div class="rule"></div>
      <ul class="events">
        <li><span class="ev">Nalangu</span><span>Thu 19 Nov · 6:00 PM</span></li>
        <li><span class="ev">Reception</span><span>Thu 19 Nov · 7:30 PM</span></li>
        <li><span class="ev">Muhurtham</span><span>Fri 20 Nov · 6:15 AM</span></li>
      </ul>
      <p class="venue">Brindavan Auditorium, Coimbatore</p>
    </div>
  </body>
</html>
